[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evoforge"
version = "0.2.0"
description = "Extensible framework for simulation-based optimization with evolutionary computation and surrogate models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Alan Diaz Manriquez" },
]
dependencies = [
  "pydantic",
  "pyyaml",
  "typer",
]

[project.optional-dependencies]
aquacrop = [
  "aquacrop==3.1.0",
]
pymoo = [
  "pymoo",
]
sklearn = [
  "joblib",
  "scikit-learn",
]

[project.scripts]
evoforge = "evoforge.cli:main"

[dependency-groups]
dev = [
  "mkdocs-material",
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["src/evoforge"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"
