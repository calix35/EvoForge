site_name: EvoForge
site_description: Extensible Framework for Simulation-Based Optimization using Evolutionary Computation and Surrogate Models
site_author: Alan Diaz Manriquez

docs_dir: docs

theme:
  name: material

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Configuration: configuration.md
  - Examples: examples.md
  - Plugins: plugins.md
  - Architecture: architecture.md
  - Development: development.md
