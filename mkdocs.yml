site_name: EvoForge
site_url: https://calix35.github.io/EvoForge/
repo_url: https://github.com/calix35/EvoForge
site_description: Extensible Framework for Simulation-Based Optimization using Evolutionary Computation and Surrogate Models
site_author: Alan Diaz Manriquez

docs_dir: docs

theme:
  name: material

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Configuration: configuration.md
  - Examples: examples.md
  - Plugins: plugins.md
  - Plugin Compatibility: plugin_compatibility.md
  - Errors: errors.md
  - Multiobjective Optimization: multiobjective.md
  - AquaCrop Adapter: aquacrop.md
  - AquaCrop Pilot: aquacrop_pilot.md
  - Architecture: architecture.md
  - Development: development.md
  - Reproducibility: reproducibility.md
  - Scaling and Limits: scaling.md
